name: Refresh animated profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow dependencies
        run: python -m pip install -r scripts/requirements-action.txt

      - name: Fetch contribution data
        env:
          GH_PROFILE_USER: Parsa-Emami
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed profile art
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          if git diff --cached --quiet; then
            echo "No profile-art changes."
            exit 0
          fi
          git commit -m "chore: refresh profile contribution art"
          git push
