name: Update profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/profile.json"
      - "scripts/**"
      - "tests/**"
      - "assets/avatar/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py
      - name: Build README, cards and site
        run: python scripts/build.py
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Theme interaction tests
        run: node --test tests/theme.test.cjs
      - name: Validate patch
        run: git diff --check
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/cards site data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile"
            git push
          fi
