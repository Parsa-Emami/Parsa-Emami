name: Update profile

# Rebuilds README.md, the SVG cards and the website from data/profile.json,
# refreshing the GitHub activity heatmap first. Runs daily, on demand, and
# whenever the content or the build scripts change.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/profile.json"
      - "scripts/**"
      - "assets/avatar/**"
      - "site/assets/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: System libraries (text shaping for the SVG cards)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Build README, cards and site
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile"
            git push
          fi
