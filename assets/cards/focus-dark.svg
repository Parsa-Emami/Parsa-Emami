L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g><text x="28" y="80" class="s" font-size="15.5" font-weight="600" fill="#fafafa">Software Architecture</text><text x="28" y="104.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">Modular monoliths, domain boundaries, refactoring</text><text x="28" y="125.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">legacy Laravel systems, data-flow design, API contracts,</text><text x="28" y="146.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">deployment structure, and maintainable source-of-truth</text><text x="28" y="167.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">decisions.</text></g><g transform="translate(415 67)"><rect x="28.5" y="24.5" width="27" height="27" rx="8" fill="#171717" stroke="#2a2a2a" stroke-width="1"/><g transform="translate(34 30) scale(0.666667)" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g><text x="28" y="80" class="s" font-size="15.5" font-weight="600" fill="#fafafa">Security Engineering</text><text x="28" y="104.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">Authentication, authorization, rate limiting, secure</text><text x="28" y="125.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">operational tooling, tenant isolation, attack-surface</text><text x="28" y="146.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">reduction, logging, integrity checks, and</text><text x="28" y="167.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">secure-by-design reviews.</text></g><line x1="0" y1="263.5" x2="830" y2="263.5" stroke="#2a2a2a" stroke-width="1"/><g transform="translate(0 263)"><rect x="28.5" y="24.5" width="27" height="27" rx="8" fill="#171717" stroke="#2a2a2a" stroke-width="1"/><g transform="translate(34 30) scale(0.666667)" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/></g><text x="28" y="80" class="s" font-size="15.5" font-weight="600" fill="#fafafa">Red Team &amp; Adversary Thinking</text><text x="28" y="104.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">Threat modeling, offensive security mindset, adversary</text><text x="28" y="125.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">emulation, social-engineering risk, cloud authorization</text><text x="28" y="146.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">risk, and translating attacker behavior into defensive</text><text x="28" y="167.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">architecture.</text></g><g transform="translate(415 263)"><rect x="28.5" y="24.5" width="27" height="27" rx="8" fill="#171717" stroke="#2a2a2a" stroke-width="1"/><g transform="translate(34 30) scale(0.666667)" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M9 13a4.5 4.5 0 0 0 3-4"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M12 13h4"/><path d="M12 18h6a2 2 0 0 1 2 2v1"/><path d="M12 8h8"/><path d="M16 8V5a2 2 0 0 1 2-2"/><circle cx="16" cy="13" r=".5"/><circle cx="18" cy="3" r=".5"/><circle cx="20" cy="21" r=".5"/><circle cx="20" cy="8" r=".5"/></g><text x="28" y="80" class="s" font-size="15.5" font-weight="600" fill="#fafafa">Applied AI &amp; Algorithms</text><text x="28" y="104.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">AI-focused graduate study combined with algorithm</text><text x="28" y="125.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">design, data analysis, engineering rules, optimization, and</text><text x="28" y="146.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">practical exploration of AI-assisted security workflows.</text></g><line x1="0" y1="459.5" x2="830" y2="459.5" stroke="#2a2a2a" stroke-width="1"/><g transform="translate(0 459)"><rect x="28.5" y="24.5" width="27" height="27" rx="8" fill="#171717" stroke="#2a2a2a" stroke-width="1"/><g transform="translate(34 30) scale(0.666667)" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7 6.82 21.18a2.83 2.83 0 0 1-3.99-.01a2.83 2.83 0 0 1 0-4L17 3"/><path d="m16 2 6 6"/><path d="M12 16H4"/></g><text x="28" y="80" class="s" font-size="15.5" font-weight="600" fill="#fafafa">Testing &amp; Reliability</text><text x="28" y="104.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">Characterization testing, regression protection,</text><text x="28" y="125.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">correctness checks, deterministic behavior, release</text><text x="28" y="146.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">validation, observability, and consistent outputs across</text><text x="28" y="167.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">multiple representations.</text></g><g transform="translate(415 459)"><rect x="28.5" y="24.5" width="27" height="27" rx="8" fill="#171717" stroke="#2a2a2a" stroke-width="1"/><g transform="translate(34 30) scale(0.666667)" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect height="8" rx="2" ry="2" width="20" x="2" y="2"/><rect height="8" rx="2" ry="2" width="20" x="2" y="14"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g><text x="28" y="80" class="s" font-size="15.5" font-weight="600" fill="#fafafa">Laravel / PHP Systems</text><text x="28" y="104.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">Production-oriented Laravel applications, Blade, queues,</text><text x="28" y="125.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">Redis, relational data models, admin tooling, exports,</text><text x="28" y="146.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">background processing, CI/CD, Docker, and progressive</text><text x="28" y="167.175" class="s" font-size="13.5" font-weight="400" fill="#a3a3a3" xml:space="preserve">modernization.</text></g><line x1="415.5" y1="67" x2="415.5" y2="655" stroke="#2a2a2a" stroke-width="1"/></g><rect x=".5" y=".5" width="829" height="654" rx="11.5" fill="none" stroke="#2a2a2a"/></svg>
