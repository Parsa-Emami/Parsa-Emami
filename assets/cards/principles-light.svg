<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="830" height="393" viewBox="0 0 830 393" role="img" aria-labelledby="t d"><title id="t">Principles</title><desc id="d">Read: Find the real system. Model: Make complexity visible. Break: Think like the failure. Prove: Ship with evidence.</desc><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1" height="10" fill="#0a0a0a" fill-opacity="0.07"/></pattern><clipPath id="clip"><rect width="830" height="393" rx="12"/></clipPath></defs><style>@font-face{font-family:'Geist';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist Mono';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.s{font-family:Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}</style><g clip-path="url(#clip)"><rect width="830" height="393" fill="#ffffff"/><rect x="0" y="0" width="830" height="14" fill="url(#hatch)"/><line x1="0" y1="14.5" x2="830" y2="14.5" stroke="#e5e5e5" stroke-width="1"/><text x="28" y="48" class="s" font-size="20" font-weight="600" fill="#0a0a0a">Principles</text><text x="133.17" y="48" class="m" font-size="12" font-weight="400" fill="#737373">(4)</text><line x1="0" y1="66.5" x2="830" y2="66.5" stroke="#e5e5e5" stroke-width="1"/><g transform="translate(0 67)"><text x="28" y="36" class="m" font-size="12" font-weight="500" fill="#737373">01</text><text x="54" y="36" class="m" font-size="12" font-weight="500" fill="#737373">Read</text><text x="28" y="66" class="s" font-size="16" font-weight="600" fill="#0a0a0a">Find the real system.</text><text x="28" y="92.175" class="s" font-size="13.5" font-weight="400" fill="#737373" xml:space="preserve">Before changing code, trace the rule, the data, the state,</text><text x="28" y="113.175" class="s" font-size="13.5" font-weight="400" fill="#737373" xml:space="preserve">and the place where reality actually lives.</text></g><g transform="translate(415 67)"><text x="28" y="36" class="m" font-size="12" font-weight="500" fill="#737373">02</text><text x="54" y="36" class="m" font-size="12" font-weight="500" fill="#737373">Model</text><text x="28" y="66" class="s" font-size="16" font-weight="600" fill="#0a0a0a">Make complexity visible.</text><text x="28" y="92.175" class="s" font-size="13.5" font-weight="400" fill="#737373" xml:space="preserve">Turn hidden constraints into explicit boundaries,</text><text x="28" y="113.175" class="s" font-size="13.5" font-weight="400" fill="#737373" xml:space="preserve">contracts, domain rules, and behavior people can reason</text><text x="28" y="134.175" class="s" font-size="13.5" font-weight="400" fill="#737373" xml:space="preserve">about.</text></g><line x1="0" y1="230.5" x2="830" y2="230.5" stroke="#e5e5e5" stroke-width="1"/><g transform="translate(0 230)"><text x="28" y="36" class="m" font-size="12" font-weight="500" fill="#737373">03</text><text x="54" y="36" class="m" font-size="12" font-weight="500" fill="#737373">Break</text><text x="28" y="66" class="s" font-size="16" font-weight="600" fill="#0a0a0a">Think like the failure.</text><text x="28" y="92.175" class="s" font-size="13.5" font-weight="400" fill="#737373" xml:space="preserve">Attack paths, misuse cases, edge conditions, and</text><text x="28" y="113.175" class="s" font-size="13.5" font-weight="400" fill="#737373" xml:space="preserve">operational pressure expose what a happy-path diagram</text><text x="28" y="134.175" class="s" font-size="13.5" font-weight="400" fill="#737373" xml:space="preserve">never will.</text></g><g transform="translate(415 230)"><text x="28" y="36" class="m" font-size="12" font-weight="500" fill="#737373">04</text><text x="54" y="36" class="m" font-size="12" font-weight="500" fill="#737373">Prove</text><text x="28" y="66" class="s" font-size="16" font-weight="600" fill="#0a0a0a">Ship with evidence.</text><text x="28" y="92.175" class="s" font-size="13.5" font-weight="400" fill="#737373" xml:space="preserve">Tests, observability, deterministic outputs, and release</text><text x="28" y="113.175" class="s" font-size="13.5" font-weight="400" fill="#737373" xml:space="preserve">discipline turn confidence from a feeling into a property.</text></g><line x1="415.5" y1="67" x2="415.5" y2="393" stroke="#e5e5e5" stroke-width="1"/></g><rect x=".5" y=".5" width="829" height="392" rx="11.5" fill="none" stroke="#e5e5e5"/></svg>
