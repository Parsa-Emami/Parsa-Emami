<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="830" height="459" viewBox="0 0 830 459" role="img" aria-labelledby="t d"><title id="t">About</title><desc id="d">I&#x27;m Parsa Emami, a software engineer and security architect. I build and improve software systems where engineering rules, security boundaries, maintainability, and operational reliability all matter at the same time. I work where product logic, engineering constraints, security boundaries and operational reality collide. The goal is not to add complexity. It is to find the real source of truth, model it explicitly, protect its boundaries, and make the system easier to reason about after the next requirement arrives. My production work is mostly Laravel/PHP: a multi-tenant CMS, engineering rule engines, e-invoicing and pricing consoles. Around it sit red-team thinking, threat modeling, and an M.Eng. in Artificial Intelligence (2025–2027) at Mazandaran University of Science and Technology. In the open: Demian, a deterministic 2D game platform, and Hanna Music Player. Ten security-platform architectures live in the Lab, specified in detail and not implemented yet.</desc><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1" height="10" fill="#0a0a0a" fill-opacity="0.07"/></pattern><clipPath id="clip"><rect width="830" height="459" rx="12"/></clipPath></defs><style>@font-face{font-family:'Geist';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.s{font-family:Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}</style><g clip-path="url(#clip)"><rect width="830" height="459" fill="#ffffff"/><rect x="0" y="0" width="830" height="14" fill="url(#hatch)"/><line x1="0" y1="14.5" x2="830" y2="14.5" stroke="#e5e5e5" stroke-width="1"/><text x="28" y="48" class="s" font-size="20" font-weight="600" fill="#0a0a0a">About</text><line x1="0" y1="66.5" x2="830" y2="66.5" stroke="#e5e5e5" stroke-width="1"/><rect x="28" y="99" width="5" height="5" rx="1" fill="#a3a3a3"/><text x="48" y="106.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">I&#x27;m Parsa Emami, a software engineer and security architect. I build and improve software systems</text><text x="48" y="131.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">where engineering rules, security boundaries, maintainability, and operational reliability all matter at</text><text x="48" y="156.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">the same time.</text><rect x="28" y="188" width="5" height="5" rx="1" fill="#a3a3a3"/><text x="48" y="195.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">I work where product logic, engineering constraints, security boundaries and operational reality</text><text x="48" y="220.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">collide. The goal is not to add complexity. It is to find the real source of truth, model it explicitly,</text><text x="48" y="245.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">protect its boundaries, and make the system easier to reason about after the next requirement</text><text x="48" y="270.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">arrives.</text><rect x="28" y="302" width="5" height="5" rx="1" fill="#a3a3a3"/><text x="48" y="309.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">My production work is mostly Laravel/PHP: a multi-tenant CMS, engineering rule engines,</text><text x="48" y="334.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">e-invoicing and pricing consoles. Around it sit red-team thinking, threat modeling, and an M.Eng. in</text><text x="48" y="359.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">Artificial Intelligence (2025–2027) at Mazandaran University of Science and Technology.</text><rect x="28" y="391" width="5" height="5" rx="1" fill="#a3a3a3"/><text x="48" y="398.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">In the open: <tspan fill="#0a0a0a" text-decoration="underline">Demian</tspan>, a deterministic 2D game platform, and <tspan fill="#0a0a0a" text-decoration="underline">Hanna</tspan><tspan fill="#0a0a0a" text-decoration="underline"> </tspan><tspan fill="#0a0a0a" text-decoration="underline">Music</tspan><tspan fill="#0a0a0a" text-decoration="underline"> </tspan><tspan fill="#0a0a0a" text-decoration="underline">Player</tspan>. Ten</text><text x="48" y="423.75" class="s" font-size="15" font-weight="400" fill="#0a0a0a" xml:space="preserve">security-platform architectures live in the <tspan fill="#0a0a0a" text-decoration="underline">Lab</tspan>, specified in detail and not implemented yet.</text></g><rect x=".5" y=".5" width="829" height="458" rx="11.5" fill="none" stroke="#e5e5e5"/></svg>
